name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  # 端到端：后端仓并排 checkout（e2e/env.ts 按 ../interviewProjects-backend 找它），Playwright 自己拉起
  # 网关 / Agent 模拟器、后端与 Vite；专用库由 e2e/reset-db.mts 在 Postgres service 上重建。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          path: interviewProjects-frontend
      - uses: actions/checkout@v4
        with:
          repository: Victor-ChanX/interviewProjects-backend
          path: interviewProjects-backend
      - uses: actions/setup-node@v4
        with:
          node-version-file: interviewProjects-frontend/.nvmrc
      - run: npm ci
        working-directory: interviewProjects-backend
      - run: npm ci
        working-directory: interviewProjects-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: interviewProjects-frontend
      - run: npm run e2e
        working-directory: interviewProjects-frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            interviewProjects-frontend/playwright-report
            interviewProjects-frontend/test-results
